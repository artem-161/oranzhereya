<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f9a6c"/>
      <stop offset=".55" stop-color="#2f6b46"/>
      <stop offset="1" stop-color="#17402b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".7">
      <stop offset="0" stop-color="#e8f5d8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e8f5d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8e8"/>
      <stop offset="1" stop-color="#cfe3b8"/>
    </linearGradient>
    <linearGradient id="leafR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcebc7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- стебель -->
  <path d="M256 410 C256 340 252 290 262 236" fill="none" stroke="#f1f6e6" stroke-width="16" stroke-linecap="round"/>
  <!-- левый лист -->
  <path d="M254 300 C188 304 128 262 118 186 C190 176 250 214 254 300 Z" fill="url(#leafL)"/>
  <path d="M248 292 C210 262 176 232 140 200" fill="none" stroke="#7fae80" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <!-- правый лист -->
  <path d="M262 244 C262 160 316 96 404 92 C410 178 352 240 262 244 Z" fill="url(#leafR)"/>
  <path d="M270 236 C312 196 346 160 386 112" fill="none" stroke="#7fae80" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <!-- горшок-капля -->
  <ellipse cx="256" cy="418" rx="70" ry="14" fill="#0f2c1d" opacity=".35"/>
</svg>
